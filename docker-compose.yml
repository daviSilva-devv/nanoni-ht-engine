services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: nanoni
      POSTGRES_PASSWORD: nanoni
      POSTGRES_DB: nanoni
    ports:
      - "5432:5432"
    volumes:
      - nanoni_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nanoni"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nanoni_pg:
